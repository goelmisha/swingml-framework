[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingml"
version = "0.1.0"
description = "Leak-free ML pipeline for NSE swing trading on daily bars"
authors = [{ name = "goelmisha" }]
requires-python = ">=3.11,<3.14"

# --- Core data pipeline (Step 1) -------------------------------------------------
# Pinned as ranges; see uv.lock for the exact resolved set.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",        # parquet cache
    "pyyaml>=6.0",        # config
    "requests>=2.31",     # NSE archive downloads
    "tenacity>=8.2",      # retry/backoff on flaky NSE endpoints
    "yfinance>=0.2.40",   # primary OHLCV source
]

[project.optional-dependencies]
# Step 3 -- modelling. Kept separate so Step 1 can run before these resolve.
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "shap>=0.45",
]
# Step 4 -- backtesting.
bt = ["vectorbt>=0.26"]
# Same-day-complete prices from the broker feed (cheap: quotes, not orders).
# The daily session token is minted by scripts/breeze_token.py (manual, per SEBI).
breeze = ["breeze-connect>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
swingml = "swingml.cli:main"

[tool.setuptools.packages.find]
include = ["swingml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
